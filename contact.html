<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Contact — House Landings</title>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600&family=Cormorant+Garamond:ital,wght@0,500;1,400&family=Josefin+Sans:wght@400;500&display=swap" rel="stylesheet" />
  <style>
    :root { --gold:#c4a574; --ivory:#f3eee4; }
    html,body{margin:0;background:#070707;color:var(--ivory);font-family:"Cormorant Garamond",Georgia,serif;background-image:repeating-linear-gradient(90deg,#050505 0 42px,#0b0b0b 42px 46px)}
    a{color:#e4d2ae;text-decoration:none}
    .wrap{width:min(720px,calc(100% - 40px));margin:0 auto;padding:72px 0}
    .tiny{font-family:"Josefin Sans",sans-serif;letter-spacing:.18em;text-transform:uppercase;font-size:11px;color:var(--gold)}
    h1{font-size:clamp(36px,7vw,64px);line-height:.95;font-weight:500}
    .muted{color:#c9c2b4}
    .btn{display:inline-block;border:1px solid var(--gold);padding:12px 16px;margin:8px 8px 0 0;font-family:"Josefin Sans",sans-serif;letter-spacing:.14em;text-transform:uppercase;font-size:11px;color:var(--ivory)}
    .btn.solid{background:var(--gold);color:#111}
  </style>
</head>
<body>
  <main class="wrap">
    <div class="tiny">House desk</div>
    <h1>Write the house.</h1>
    <p class="muted">Seats, gifts, press, and fleet questions. No unsolicited token pitches.</p>
    <p><a class="btn solid" href="mailto:hello@lynxlogix.net?subject=House%20landing">Email hello@lynxlogix.net</a></p>
    <p><a class="btn" href="https://lynxlogix-net.vercel.app/contact.html">Full contact form on the desk</a> <a class="btn" href="index.html">House</a></p>
  </main>
</body>
</html>
